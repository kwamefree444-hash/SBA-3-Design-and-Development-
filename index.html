<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- displays site properly based on user's device -->
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Raleway:ital,wght@0,100..900;1,100..900&display=swap"rel="stylesheet">
  <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png">
  <title>Frontend Mentor | Fylo data storage component</title>
</head>

<body class=" content-center bg-[hsl(229,57%,11%)] h-screen w-full mx-auto bg-[url('./images/bg-desktop.png')] bg-initial bg-no-repeat bg-bottom ">

    <div class="flex h-[250px] w-[1300px] justify-end justify-center ">
  
      
      <div class="flex h-64 w-[400px] bg-[hsl(228,56%,26%)] rounded-[10px_100px_10px_10px] -mt-[75px] mr-60" shrink-0 >
        

        <img src="./images/logo.svg" alt="Logo" class="flex h-12 shrink-0 mt-[30px] translate-x-[60px] ">

        <div class="flex items-center shrink-0 flex-row translate-x-[-100px] gap-[15px] mt-12  ">
          <img src="./images/icon-document.svg" alt="Logo" class="flex bg-[hsl(229,57%,11%)] p-[15px] rounded-[10px]  h-12 shrink-0 ">
          <img src="./images/icon-folder.svg" alt="Logo" class="flex bg-[hsl(229,57%,11%)] p-[15px] rounded-[10px] h-12 shrink-0">
          <img src="./images/icon-upload.svg" alt="Logo" class="flex bg-[hsl(229,57%,11%)] p-[15px] rounded-[10px] h-12 shrink-0">
        </div>


      </div>


      <div  class="flex h-[185px] w-[600px] bg-[hsl(228,56%,26%)] -mt-[3px] -ml-[200px] rounded-[10px_10px_10px_10px] bg-[url('./images/loading.png')] bg-initial bg-no-repeat   bg-[length:400px_25px] bg-[position:25px_100px] ">
        
        <div class="flex text-[hsl(243,100%,93%)] font-['Raleway'] font-light mt-[50px] ml-[30px] ">
          <p>You've used <b class="font-bold">815 GB</b> of your storage</p>
        </div>

        <div class="flex bg-white h-[80px] w-[176px] -mt-[53px] ml-[102px] rounded-[10px_10px_10px_10px]">
          
          <div class="flex font-bold  ">
            <p class="font-['Raleway'] text-[40px] mt-[10px] ml-[20px] ">185</p>
          </div>

          <div class="flex font-bold mt-[25px] shrink-0">
            <p class="ml-[18px] mt-[9px] text-[14px] text-[hsl(229,7%,55%)] shrink-0">GB LEFT</p>
          </div>

          <div class="flex -mr-16 h-auto w-auto -translate-x-[515px] mt-[175px]">
            <p class=" text-[14px] text-[hsl(243,100%,93%)] font-bold font-['Raleway'] ">0 GB</p>
          </div>

          <div class="flex -mr-16 h-auto w-auto -translate-x-[145px] mt-[175px]">
            <p class=" text-[14px] text-[hsl(243,100%,93%)] font-bold font-['Raleway'] ">100 GB</p>
          </div>


        </div>

      </div>




    </div>
</div>
  


































</body>

</html>
